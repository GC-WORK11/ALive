<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FAFAF7">
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<title>Alive · live preview</title>
<link rel="preload" href="fonts/satoshi-regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/satoshi-medium.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/satoshi-light.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="sim.css">
</head>
<body>
<div id="sim" class="sim"></div>
<noscript><p style="padding:40px 24px;font:15px/1.5 system-ui;color:#4A4E57">The Alive live preview needs JavaScript.</p></noscript>
<script>
/* tolerant loader: shell first, then every screen in order; a missing screen (404) is skipped */
(function () {
  var files = ['shell.js', 'screens/home.js', 'screens/map.js', 'screens/search.js', 'screens/compare.js',
    'screens/nav.js', 'screens/receipt.js', 'screens/stays.js', 'screens/hours.js', 'screens/settings.js'];
  var left = files.length;
  function settle() {
    if (--left === 0 && window.SIM) window.SIM.start('home');
  }
  files.forEach(function (f) {
    var s = document.createElement('script');
    s.src = f;
    s.async = false;
    s.onload = settle;
    s.onerror = settle;
    document.body.appendChild(s);
  });
})();
</script>
</body>
</html>
