<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FAFAF7">
<link rel="icon" href="data:,">
<title>Alive — know what the air did to you</title>
<link rel="preload" href="../sim/fonts/satoshi-regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../sim/fonts/satoshi-medium.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../sim/fonts/satoshi-light.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../sim/sim.css">
<link rel="stylesheet" href="app.css">
</head>
<body class="alive-app">
<div id="sim" class="sim"></div>
<noscript><p style="padding:40px 24px;font:15px/1.5 system-ui;color:#4A4E57">Alive needs JavaScript.</p></noscript>
<script>
/* loader: shared shell, then app modules, then screens in order; a missing file is skipped */
(function () {
  var files = ['../sim/shell.js', 'store.js', 'api.js',
    'screens/home.js', 'screens/go.js', 'screens/ride.js', 'screens/receipt.js',
    'screens/air.js', 'screens/explore.js', 'screens/profile.js'];
  var left = files.length;
  function settle() { if (--left === 0 && window.SIM) window.SIM.start('home'); }
  files.forEach(function (f) {
    var s = document.createElement('script');
    s.src = f; s.async = false; s.onload = settle; s.onerror = settle;
    document.body.appendChild(s);
  });
})();
</script>
</body>
</html>
